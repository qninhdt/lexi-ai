apiVersion: batch/v1
kind: Job
metadata:
  name: lexi-migrate
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: lexi-ai:latest
          command: ["/app/.venv/bin/alembic", "upgrade", "head"]
          envFrom:
            - secretRef: {name: lexi-service-config}
