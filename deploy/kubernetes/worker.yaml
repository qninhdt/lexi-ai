apiVersion: apps/v1
kind: Deployment
metadata:
  name: lexi-worker
spec:
  replicas: 2
  selector:
    matchLabels: {app: lexi-worker}
  template:
    metadata:
      labels: {app: lexi-worker}
    spec:
      containers:
        - name: worker
          image: lexi-ai:latest
          command: ["/app/.venv/bin/python", "-m", "lexi_service.worker.runner"]
          envFrom:
            - secretRef: {name: lexi-service-config}
          env:
            - name: LEXI_CAMBRIDGE_DB_PATH
              value: /reference/cambridge.db
          volumeMounts:
            - name: reference-dataset
              mountPath: /reference
              readOnly: true
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
      volumes:
        - name: reference-dataset
          persistentVolumeClaim:
            claimName: lexi-reference-dataset
