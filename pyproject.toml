[project]
name = "lexi-ai"
version = "0.1.0"
description = "Async English learner's dictionary with generation from selected reference entries."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [
    { name = "qninhdt", email = "qndt123@gmail.com" }
]
dependencies = [
    "orjson>=3.12.0,<4",
    "cachetools>=7.2.0,<8",
    "tantivy>=0.26.2,<0.27",
    "sqlalchemy[asyncio]>=2.1.3",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "jinja2>=3.1.6",
    "json-e>=4.8.4,<5",
    "json-repair>=0.63.5,<1",
    "openai>=3.24.0",
    "pydantic>=2.13.5",
    "nltk>=3.10.3",
    "alembic>=1.20.0,<2",
    "typesafe-sdk>=0.7.2",
    "system-one-adapter[openai]>=0.2.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "import-linter>=2.15",
    "python-dotenv>=1.2.4,<2",
    "tqdm>=4.70.1,<5",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
prerelease = "disallow"

[tool.uv.build-backend]
module-name = "lexi_ai"
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["archive"]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


[tool.importlinter]
root_package = "lexi_ai"
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "pure contracts cannot import persistence or provider transports"
type = "forbidden"
source_modules = ["lexi_ai.models", "lexi_ai.text", "lexi_ai.vocab", "lexi_ai.config"]
forbidden_modules = [
    "lexi_ai.db",
    "lexi_ai.schema",
    "lexi_ai.inference.llm",
    "lexi_ai.inference.decision",
    "lexi_ai.questions",
    "sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "shared inference infrastructure cannot depend on domain tasks or persistence"
type = "forbidden"
source_modules = ["lexi_ai.inference"]
forbidden_modules = [
    "lexi_ai.db",
    "lexi_ai.schema",
    "lexi_ai.questions",
    "lexi_ai.words",
    "lexi_ai.themes",
    "lexi_ai.translation",
    "lexi_ai.relations",
    "lexi_ai.api",
]

[[tool.importlinter.contracts]]
name = "database infrastructure cannot depend on dictionary domains or schema"
type = "forbidden"
source_modules = ["lexi_ai.db"]
forbidden_modules = [
    "lexi_ai.schema", "lexi_ai.models", "lexi_ai.words", "lexi_ai.questions",
    "lexi_ai.themes", "lexi_ai.translation", "lexi_ai.relations", "lexi_ai.inference",
    "lexi_ai.api",
]
